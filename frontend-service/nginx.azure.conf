server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    resolver RESOLVER_IP valid=10s;

    location /api/ {
        set $backend https://api-gateway.greenstone-e5d6ceb4.germanywestcentral.azurecontainerapps.io;
        proxy_pass $backend;
        proxy_set_header Host api-gateway.greenstone-e5d6ceb4.germanywestcentral.azurecontainerapps.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}